<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Gallery • Josh + Shione</title>
    <meta
      name="description"
      content="A private gallery of photos shared between Josh and Shione."
    />
    <meta name="theme-color" content="#fff1f4" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="page-header">
        <div class="page-nav">
          <a class="back-link" href="./index.html">← Back home</a>
        </div>
      </header>

      <main class="main-layout">
        <section class="gallery-panel" id="gallery" aria-labelledby="gallery-heading">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Captured moments of us</p>
              <h2 id="gallery-heading">Our gallery</h2>
              <p class="section-copy">
                Every memory, every smile, every moment we've shared together.
              </p>
            </div>
          </div>

          <div class="gallery-grid" id="gallery-grid"></div>
          <p class="empty-state" id="gallery-empty-state" hidden>
            Our gallery is empty for now. Add photos to the manifest to get started.
          </p>
        </section>
      </main>

      <footer class="site-footer">
        <p class="site-footer-copy">For Shione, always. Love, Josh.</p>
      </footer>
    </div>

    <template id="gallery-item-template">
      <figure class="gallery-item">
        <img class="gallery-image" alt="" />
        <figcaption class="gallery-caption">
          <h3 class="gallery-title"></h3>
          <p class="gallery-date"></p>
        </figcaption>
      </figure>
    </template>

    <script src="./data/photos.js"></script>
    <script src="./data/messages.js"></script>
    <script src="./gallery.js"></script>
  </body>
</html>
